# Abyss Hollow settings are intentionally plain text so designers can edit defaults.
# A 0 x 0 resolution means the game will use SFML's detected desktop mode on first launch.
resolution_width=0
resolution_height=0
display_mode=borderless
ui_scale=1
ui_scale_manual=false
main_volume=80
player_volume=80
font_path=assets/fonts/main.ttf
